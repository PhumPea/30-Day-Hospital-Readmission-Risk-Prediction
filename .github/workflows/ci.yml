name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# สิทธิ์ขั้นต่ำที่ต้องใช้: อ่านโค้ด + push Docker image ขึ้น GHCR (job docker)
permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
  PREFECT_SERVER_ANALYTICS_ENABLED: "false"
  PREFECT_LOGGING_LEVEL: WARNING

jobs:
  code-quality:                       # ด่าน 1/3: คุณภาพโค้ด
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements.lock.txt && pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (incl. training-serving skew + API contract)
        run: pytest -q

  data-validation:                    # ด่าน 2/3: ความถูกต้องของข้อมูล
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements.lock.txt && pip install --no-deps -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('params.yaml') }}
      - name: Ingest raw data (UCI)
        run: python -m readmit.data.ingest
      - name: Validate real data against schema (must PASS)
        run: python -m readmit.data.schema
      # ไฟล์เสียต้องไม่ผ่าน ถ้าผ่านแปลว่า schema หละหลวม -> ให้ CI fail
      - name: Validate corrupted data (must FAIL -> proves the guard works)
        run: |
          if python -m readmit.data.schema data/bad_samples/bad_raw.csv; then
            echo "::error::bad data was NOT rejected"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: validation-report, path: reports/validation.json}

  model-quality:                      # ด่าน 3/3: เกณฑ์คุณภาพโมเดล
    needs: [code-quality, data-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements.lock.txt && pip install --no-deps -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('params.yaml') }}
      - name: Run full DAG (ingest -> validate -> split -> train -> gate)
        run: python -m pipelines.flow
      # ตารางผ่าน/ไม่ผ่านของทุกโมเดล แสดงในหน้า Summary ของ run (ขึ้นแม้ gate ไม่ผ่าน)
      - name: Per-model gate table
        if: always()
        run: |
          python - >> $GITHUB_STEP_SUMMARY <<'EOF'
          import csv, yaml
          g = yaml.safe_load(open("params.yaml"))["gate"]
          rows = list(csv.DictReader(open("reports/experiments.csv")))
          lace = next(float(r["val_pr_auc"]) for r in rows if r["name"] == "baseline_lace")
          def m(ok):
              return "✅" if ok else "❌"
          print("### ผลแต่ละโมเดลเทียบเกณฑ์ gate (validation set)")
          print(f"เกณฑ์: PR-AUC ≥ {g['min_pr_auc']} · ชนะ LACE ≥ {g['min_gain_over_lace']} · "
                f"Brier ≤ {g['max_brier']} · Fairness gap ≤ {g['max_fairness_gap']}")
          print()
          print("| โมเดล | PR-AUC | ชนะ LACE | Brier | Fairness gap | ผล |")
          print("|---|---|---|---|---|---|")
          for r in rows:
              pr, br, fg = float(r["val_pr_auc"]), float(r["val_brier"]), float(r["val_fairness_gap"])
              is_lace = r["name"] == "baseline_lace"
              c = [pr >= g["min_pr_auc"],
                   is_lace or pr >= lace + g["min_gain_over_lace"],
                   br <= g["max_brier"],
                   fg <= g["max_fairness_gap"]]
              beat = "—" if is_lace else m(c[1])
              print(f"| {r['name']} | {pr:.3f} {m(c[0])} | {beat} | {br:.3f} {m(c[2])} | {fg:.3f} {m(c[3])} | {m(all(c))} |")
          EOF
      # ผล gate ของโมเดลที่ถูกเลือก (แสดงเหตุผลเสมอ แม้ขั้นก่อนหน้าจะ fail)
      - name: Enforce model quality gate
        if: always()
        run: python scripts/check_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: model-reports, path: reports/}

  docker:                             # build image + รันเทสต์ใน image แล้ว push (เฉพาะ main)
    needs: [model-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t readmit:${{ github.sha }} .
      - name: Tests inside image
        run: docker run --rm readmit:${{ github.sha }} pytest -q
      - name: Push to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/readmission-api
          IMG=$(echo $IMG | tr '[:upper:]' '[:lower:]')
          docker tag readmit:${{ github.sha }} $IMG:${{ github.sha }}
          docker tag readmit:${{ github.sha }} $IMG:latest
          docker push $IMG:${{ github.sha }} && docker push $IMG:latest
